    <script>
      // Suppress Vite dev server HMR WebSocket connection failure in Cloud Run sandbox
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
    </script>
